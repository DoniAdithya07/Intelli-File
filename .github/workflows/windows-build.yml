# Builds the Windows installer on a real windows-latest runner: runs the
# regression suite, freezes the backend, bundles the models and builds the
# NSIS installer + the portable zip. Mirrors docs/BUILD_WINDOWS.md, which is
# the same steps run by hand on a Windows PC.
#
# llama-cpp-python comes as a prebuilt CPU wheel (AVX2) from the project's
# wheel index, so no C++ compiler step is needed for it.
name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  EXE_SUFFIX: .exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- Phase 14: freeze the Python backend and gather the resources ----
      # The backend has no PyTorch dependency any more (Whisper runs on
      # onnxruntime alone), so this venv is ~750 MB and freezes cleanly.
      - name: Backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      # Models are not in the repo (see .gitignore); each script fetches from
      # Hugging Face and pins the exact files the app expects. This is the
      # only step in the whole project that touches the network.
      - name: Download models (~1.7 GB)
        working-directory: backend
        run: |
          python scripts/download_model.py
          python scripts/download_embedding_model.py
          python scripts/tune_semantic_thresholds.py bge-small-en-v1.5
          python scripts/download_whisper_model.py
          python scripts/download_clip_model.py
          python scripts/download_reranker_model.py
          python scripts/download_llm_model.py
          python scripts/download_wordlist.py

      - name: Regression suite (offline guard on)
        working-directory: backend
        env:
          INTELLIFILE_OFFLINE_GUARD: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/run_all_phases.py

      - name: Freeze backend (PyInstaller)
        working-directory: backend
        run: python -m PyInstaller --noconfirm intellifile-backend.spec

      - name: Smoke-test the frozen backend
        working-directory: backend
        shell: bash
        run: |
          INTELLIFILE_MODELS_DIR="$PWD/models" INTELLIFILE_DATA_DIR="$PWD/data" ./dist/intellifile-backend/intellifile-backend${EXE_SUFFIX:-} --port 8756 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8756/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8756/health
          curl -sf "http://127.0.0.1:8756/search?q=hello" > /dev/null
          kill %1 || true

      - name: Assemble resources (backend + models + sample folder)
        working-directory: backend
        run: python scripts/assemble_resources.py

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install

      # No installer: the app is ~2.6 GB (1.7 GB of models) and both NSIS
      # and WiX/MSI stop at 2 GB ("error mmapping file ... out of range",
      # measured 2026-09-25). The deliverable is the portable folder, which
      # also runs without admin rights on locked-down laptops.
      - name: Build Tauri app (no installer)
        working-directory: desktop
        run: npm run tauri build -- --no-bundle

      - name: Portable zip
        working-directory: backend
        run: python scripts/package_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: intellifile-windows
          path: desktop/src-tauri/target/release/IntelliFile-windows.zip
          compression-level: 0
